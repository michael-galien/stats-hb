<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handball — Statistiques</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤾%3C/text%3E%3C/svg%3E">
<style>
:root{--bleu:#1d4ed8;--bleu-c:#dbeafe;--orange:#f97316;--orange-c:#ffedd5;--nuit:#0b1530;--parquet:#c98a4b;
--fond:#eef2f8;--carte:#fff;--txt:#0f172a;--doux:#64748b;--ligne:#e2e8f0;--vert:#16a34a;--rouge:#dc2626;
--ombre:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--fond);color:var(--txt);line-height:1.45}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* --- En-tête : terrain de handball --- */
.hero{position:relative;overflow:hidden;color:#fff;padding:34px 0 92px;
background:radial-gradient(1200px 400px at 85% -10%,rgba(249,115,22,.45),transparent 60%),
radial-gradient(900px 380px at -5% 110%,rgba(29,78,216,.55),transparent 60%),linear-gradient(160deg,#0b1530,#111f45 55%,#0b1530)}
.court{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.hero .wrap{position:relative}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:#fed7aa}
.ball{width:42px;height:42px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));animation:rebond 2.6s ease-in-out infinite}
@keyframes rebond{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(25deg)}}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;margin:18px 0 8px;font-weight:900;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#fb923c,#fdba74);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin:0;color:#cbd5e1;max-width:640px}
.saisons{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.saisons button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;
padding:7px 16px;font-weight:700;cursor:pointer;font-size:.9rem;transition:.15s}
.saisons button:hover{background:rgba(255,255,255,.18)}
.saisons button.on{background:var(--orange);border-color:var(--orange);box-shadow:0 6px 18px rgba(249,115,22,.4)}
/* --- Tableau d'affichage --- */
.board{margin-top:-62px;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#0f1b3d;color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 10px 30px rgba(11,21,48,.35);
border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--bleu),var(--orange))}
.stat b{display:block;font-family:"Consolas","Courier New",monospace;font-size:2.1rem;color:#fde68a;letter-spacing:.04em;
text-shadow:0 0 14px rgba(253,230,138,.45)}
.stat small{color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;font-weight:700}
/* --- Onglets et outils --- */
.tabs{display:flex;gap:6px;margin:28px 0 14px;border-bottom:2px solid var(--ligne)}
.tabs button{border:0;background:none;padding:12px 18px;font-size:1rem;font-weight:800;color:var(--doux);cursor:pointer;
border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--txt);border-color:var(--orange)}
.tabs button .n{display:inline-block;margin-left:6px;background:var(--ligne);color:var(--doux);border-radius:999px;padding:1px 8px;font-size:.75rem}
.tabs button.on .n{background:var(--orange-c);color:#c2410c}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--ligne);font-size:.95rem;background:#fff;outline:none}
.search input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.search::before{content:"🔎";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.95rem}
select{padding:10px 12px;border-radius:12px;border:1px solid var(--ligne);background:#fff;font-size:.9rem;font-weight:600;color:var(--txt)}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filtres button{border:1px solid var(--ligne);background:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.82rem;
color:var(--doux);cursor:pointer}
.filtres button.on{background:var(--nuit);color:#fff;border-color:var(--nuit)}
.vide{padding:40px;text-align:center;color:var(--doux);background:#fff;border-radius:16px;border:1px dashed var(--ligne)}
.h2{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:900;margin:26px 0 12px}
.h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--ligne),transparent)}
/* --- Rencontres --- */
details.compet{background:var(--carte);border-radius:18px;box-shadow:var(--ombre);margin-bottom:14px;overflow:hidden}
details.compet>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px;
background:linear-gradient(90deg,#fff,#f8fafc)}
details.compet>summary::-webkit-details-marker{display:none}
details.compet>summary .chev{margin-left:auto;transition:.2s;color:var(--doux)}
details.compet[open]>summary .chev{transform:rotate(90deg)}
.strate{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;
background:var(--bleu-c);color:var(--bleu)}
.strate.national{background:#fef3c7;color:#b45309}
.compet-nom{font-weight:900;font-size:1.02rem}
.compet-n{color:var(--doux);font-size:.85rem;font-weight:600}
.groupe{padding:4px 18px 16px}
.groupe h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);margin:14px 0 8px;font-weight:800}
a.match{display:grid;grid-template-columns:92px 1fr 104px 1fr 22px;align-items:center;gap:12px;padding:10px 12px;
border-radius:12px;text-decoration:none;border:1px solid transparent;transition:.15s}
a.match:nth-child(odd){background:#f8fafc}
a.match:hover{border-color:var(--orange);background:#fff7ed;transform:translateX(2px)}
.m-date{font-size:.8rem;color:var(--doux);font-weight:700;line-height:1.2}
.m-date small{display:block;font-weight:600;opacity:.8}
.eq{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq.r{text-align:right}
.eq.win{font-weight:900}
.eq.r.win{color:var(--bleu)}.eq.v.win{color:#c2410c}
.sc{justify-self:center;display:flex;gap:2px;font-family:"Consolas","Courier New",monospace;font-weight:900;font-size:1.05rem}
.sc span{background:var(--nuit);color:#fde68a;border-radius:7px;min-width:38px;text-align:center;padding:4px 6px}
.sc span.w{background:var(--orange);color:#fff}
.m-go{color:var(--orange);font-weight:900}
/* --- Joueurs --- */
.podiums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.podium{background:var(--carte);border-radius:18px;box-shadow:var(--ombre);padding:16px 18px}
.podium h3{margin:0 0 10px;font-size:.95rem;font-weight:900}
.podium ol{list-style:none;margin:0;padding:0}
.podium li a{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;text-decoration:none}
.podium li a:hover{background:#fff7ed}
.medal{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8rem;color:#fff;background:#94a3b8;flex:none}
.medal.m1{background:linear-gradient(135deg,#facc15,#ca8a04)}.medal.m2{background:linear-gradient(135deg,#cbd5e1,#64748b)}
.medal.m3{background:linear-gradient(135deg,#fdba74,#c2410c)}
.podium .qui{flex:1;min-width:0}.podium .qui b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium .qui small{color:var(--doux);font-size:.75rem}
.podium .val{font-weight:900;font-size:1.15rem;color:var(--orange)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.joueur{display:flex;flex-direction:column;background:var(--carte);border-radius:18px;box-shadow:var(--ombre);text-decoration:none;
overflow:hidden;transition:.18s;border:1px solid transparent}
a.joueur:hover{transform:translateY(-3px);border-color:var(--orange);box-shadow:0 14px 30px rgba(15,23,42,.12)}
.j-top{display:flex;gap:12px;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#eff6ff,#fff)}
a.joueur.gk .j-top{background:linear-gradient(135deg,#fff7ed,#fff)}
.maillot{width:48px;height:52px;flex:none;position:relative;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.05rem;padding-top:6px}
.maillot svg{position:absolute;inset:0;width:100%;height:100%}
.maillot span{position:relative}
.j-nom{font-weight:900;font-size:.98rem;line-height:1.15}
.j-eq{font-size:.78rem;color:var(--doux);margin-top:2px}
.j-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--bleu-c);color:var(--bleu)}
.tag.gk{background:var(--orange-c);color:#c2410c}.tag.cat{background:#f1f5f9;color:#475569}
.j-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ligne);margin-top:auto}
.j-stats div{padding:10px 6px;text-align:center}
.j-stats div+div{border-left:1px solid var(--ligne)}
.j-stats b{display:block;font-size:1.15rem;font-weight:900}
.j-stats small{font-size:.66rem;color:var(--doux);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
footer{margin:40px 0 0;padding:26px 0 34px;color:var(--doux);font-size:.82rem;text-align:center;
background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(201,138,75,.07) 46px 48px)}
@media (max-width:860px){.board{grid-template-columns:repeat(2,1fr)}.podiums{grid-template-columns:1fr}}
@media (max-width:600px){a.match{grid-template-columns:1fr 92px 1fr;row-gap:4px}
.m-date{grid-column:1/-1}.m-go{display:none}.eq{white-space:normal;font-size:.85rem}.tabs button{padding:10px 10px;font-size:.92rem}}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const nf = (n, d=0) => Number(n ?? 0).toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d});
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const fDate = d => { if (!d) return ''; const [y,m,j] = d.split('-').map(Number); const dt = new Date(y, m-1, j);
  return `${JOURS[dt.getDay()]} ${j} ${MOIS[m-1]}`; };
const titre = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : '';

const etat = {saison: DATA.saisons[0]?.saison, onglet: 'rencontres', q: '', compet: '', championnat: '', poste: '', tri: 'nom',
  ouvert: {rencontres: null, joueurs: null}};
const lireHash = () => { const [s, o] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (DATA.saisons.some(x => x.saison === s)) etat.saison = s; if (o === 'joueurs' || o === 'rencontres') etat.onglet = o; };
const ecrireHash = () => history.replaceState(null, '', `#${etat.saison}/${etat.onglet}`);
const courante = () => DATA.saisons.find(s => s.saison === etat.saison) || {rencontres: [], joueurs: []};

function rendreSaisons() {
  $('#saisons').innerHTML = DATA.saisons.map(s =>
    `<button class="${s.saison === etat.saison ? 'on' : ''}" data-s="${esc(s.saison)}">🏆 ${esc(s.saison)}</button>`).join('');
}

function rendreTableau() {
  const s = courante();
  const joues = s.rencontres.filter(r => r.sr !== null);
  const buts = joues.reduce((a, r) => a + r.sr + r.sv, 0);
  const compets = new Set(s.rencontres.map(r => r.championnat)).size;
  $('#board').innerHTML = [
    [nf(s.rencontres.length), 'Rencontres'], [nf(s.joueurs.length), 'Joueurs'],
    [nf(buts), 'Buts marqués'], [joues.length ? nf(buts / joues.length, 1) : '—', 'Buts / match']]
    .map(([v, l]) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');
  $('#n-rencontres').textContent = s.rencontres.length;
  $('#n-joueurs').textContent = s.joueurs.length;
  $('#lead').textContent = `${compets} compétition(s) · ${s.rencontres.length} rencontre(s) · ${s.joueurs.length} joueur(s) suivis sur la saison ${etat.saison}.`;
}

function filtres(id, valeurs, cle, libelle) {
  const el = $(id);
  if (valeurs.length < 2) { el.innerHTML = ''; return; }
  el.innerHTML = [['', libelle], ...valeurs.map(v => [v, v])].map(([v, l]) =>
    `<button class="${etat[cle] === v ? 'on' : ''}" data-k="${cle}" data-v="${esc(v)}">${esc(l)}</button>`).join('');
}

function ligneMatch(r) {
  const joue = r.sr !== null;
  const wr = joue && r.sr > r.sv, wv = joue && r.sv > r.sr;
  return `<a class="match" href="${r.lien}" title="${esc(r.resultat || '')}${r.lieu ? ' — ' + esc(r.lieu) : ''}">
    <span class="m-date">${fDate(r.date)}<small>${esc(r.heure || '')} ${r.journee ? '· ' + esc(r.journee.replace('Journée', 'J.')) : ''}</small></span>
    <span class="eq r ${wr ? 'win' : ''}">${esc(r.recevant)}</span>
    <span class="sc">${joue ? `<span class="${wr ? 'w' : ''}">${r.sr}</span><span class="${wv ? 'w' : ''}">${r.sv}</span>` : '<span>–</span><span>–</span>'}</span>
    <span class="eq v ${wv ? 'win' : ''}">${esc(r.visiteur)}</span>
    <span class="m-go">›</span></a>`;
}

function accordeon(blocs, onglet, vide) {
  // blocs : [{cle, strate, titre, compte, groupes: [[sous-titre, html]]}]
  if (!blocs.length) return `<div class="vide">${vide}</div>`;
  const seul = blocs.length === 1;
  return blocs.map(b => `<details class="compet" data-onglet="${onglet}" data-cle="${esc(b.cle)}" ${seul || etat.ouvert[onglet] === b.cle ? 'open' : ''}><summary>
      <span class="strate ${esc(norm(b.strate))}">${esc(b.strate)}</span><span class="compet-nom">${esc(b.titre)}</span>
      <span class="compet-n">${b.compte}</span><span class="chev">▶</span></summary>
      ${b.groupes.map(([g, h]) => `<div class="groupe">${g ? `<h3>${esc(g)}</h3>` : ''}${h}</div>`).join('')}
    </details>`).join('');
}

function regrouper(elements, cles) {
  // elements : [[strate, championnat, groupe, objet]] → Map « strate|championnat » → Map groupe → objets
  const m = new Map();
  for (const [strate, champ, groupe, o] of elements) {
    const k = `${strate}|${champ}`;
    if (!m.has(k)) m.set(k, new Map());
    const g = m.get(k);
    if (!g.has(groupe)) g.set(groupe, []);
    g.get(groupe).push(o);
  }
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([k, g]) => [k, [...g.entries()].sort((a, b) => a[0].localeCompare(b[0]))]);
}

function rendreRencontres() {
  const s = courante();
  filtres('#f-rencontres', [...new Set(s.rencontres.map(r => r.championnat))].sort(), 'compet', 'Toutes les compétitions');
  const q = norm(etat.q);
  const liste = s.rencontres.filter(r => (!etat.compet || r.championnat === etat.compet) &&
    (!q || norm(`${r.recevant} ${r.visiteur} ${r.code} ${r.lieu} ${r.championnat} ${r.groupe}`).includes(q)))
    .sort((a, b) => `${b.date}${b.heure}`.localeCompare(`${a.date}${a.heure}`));
  const blocs = regrouper(liste.map(r => [r.strate, r.championnat, r.groupe, r]))
    .map(([k, groupes]) => { const [strate, titre] = k.split('|'); const n = groupes.reduce((a, [, l]) => a + l.length, 0);
      return {cle: k, strate, titre, compte: `${n} match${n > 1 ? 's' : ''}`, groupes: groupes.map(([g, l]) => [g, l.map(ligneMatch).join('')])}; });
  $('#v-rencontres').innerHTML = accordeon(blocs, 'rencontres', 'Aucune rencontre ne correspond à la recherche.');
}

const MAILLOT = c => `<svg viewBox="0 0 48 52"><path d="M15 2 L4 8 L0 20 L8 23 L9 50 L39 50 L40 23 L48 20 L44 8 L33 2 Q24 9 15 2Z" fill="${c}" stroke="rgba(0,0,0,.15)" stroke-width="1.5"/></svg>`;

function carteJoueur(j) {
  const lib = j.gardien ? 'Arrêts' : 'Buts';
  return `<a class="joueur ${j.gardien ? 'gk' : ''}" href="${j.lien}">
    <div class="j-top"><div class="maillot">${MAILLOT(j.gardien ? '#f97316' : '#1d4ed8')}<span>${esc(j.maillot || '?')}</span></div>
      <div><div class="j-nom">${esc(j.nom)}</div><div class="j-eq">${esc(j.equipes)}</div>
      <div class="j-tags"><span class="tag ${j.gardien ? 'gk' : ''}">${esc(j.poste || 'Joueur')}</span>${j.categories.map(c => `<span class="tag cat">${esc(c)}</span>`).join('')}</div></div></div>
    <div class="j-stats"><div><b>${nf(j.matchs)}</b><small>Matchs</small></div><div><b>${nf(j.total)}</b><small>${lib}</small></div>
      <div><b>${nf(j.moyenne, 1)}</b><small>Par match</small></div></div></a>`;
}

function podium(titreP, liste, val, sous) {
  if (!liste.length) return '';
  return `<div class="podium"><h3>${titreP}</h3><ol>${liste.map((j, i) => `<li><a href="${j.lien}">
    <span class="medal m${i + 1}">${i + 1}</span><span class="qui"><b>${esc(j.nom)}</b><small>${esc(sous(j))}</small></span>
    <span class="val">${val(j)}</span></a></li>`).join('')}</ol></div>`;
}

function rendreJoueurs() {
  const s = courante();
  const champs = [...new Set(s.joueurs.flatMap(j => j.competitions.map(c => c.championnat)))].sort();
  filtres('#f-joueurs', champs, 'championnat', 'Tous les championnats');
  const champ = s.joueurs.filter(j => !j.gardien), gk = s.joueurs.filter(j => j.gardien);
  const top = (l, f) => [...l].sort((a, b) => f(b) - f(a) || a.nom.localeCompare(b.nom)).slice(0, 5);
  const regulier = l => l.filter(j => j.matchs >= 3);
  $('#podiums').innerHTML = podium('🔥 Meilleurs buteurs', top(champ, j => j.total), j => nf(j.total), j => `${j.equipes} · ${nf(j.matchs)} match(s)`) +
    podium('🎯 Meilleures moyennes <small style="color:var(--doux);font-weight:600">(3 matchs min.)</small>',
      top(regulier(champ), j => j.moyenne), j => nf(j.moyenne, 1), j => `${nf(j.total)} buts en ${nf(j.matchs)} matchs`) +
    podium('🧤 Murs de la saison', top(gk, j => j.total), j => nf(j.total), j => `${j.equipes} · ${nf(j.moyenne, 1)} arrêts / match`);
  const q = norm(etat.q);
  const tris = {nom: (a, b) => 0, total: (a, b) => b.total - a.total, moyenne: (a, b) => b.moyenne - a.moyenne, matchs: (a, b) => b.matchs - a.matchs};
  const liste = s.joueurs.filter(j => (!etat.poste || (etat.poste === 'gk') === j.gardien) &&
      (!q || norm(`${j.nom} ${j.licence} ${j.equipes} ${j.club}`).includes(q)))
    .sort((a, b) => tris[etat.tri](a, b));
  const elements = liste.flatMap(j => (j.competitions.length ? j.competitions : [{strate: '', championnat: 'Autres', groupe: ''}])
    .filter(c => !etat.championnat || c.championnat === etat.championnat)
    .map(c => [c.strate, c.championnat, c.groupe, j]));
  const blocs = regrouper(elements).map(([k, groupes]) => { const [strate, titre] = k.split('|');
    const n = new Set(groupes.flatMap(([, l]) => l.map(j => j.licence))).size;
    return {cle: k, strate, titre, compte: `${n} joueur${n > 1 ? 's' : ''}`,
      groupes: groupes.map(([g, l]) => [g, `<div class="grille">${l.map(carteJoueur).join('')}</div>`])}; });
  $('#v-joueurs').innerHTML = accordeon(blocs, 'joueurs', 'Aucun joueur ne correspond à la recherche.');
}

function rendre() {
  rendreSaisons(); rendreTableau();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.o === etat.onglet));
  $('#p-rencontres').hidden = etat.onglet !== 'rencontres';
  $('#p-joueurs').hidden = etat.onglet !== 'joueurs';
  $('#q').placeholder = etat.onglet === 'rencontres' ? 'Rechercher une équipe, une salle, un code de feuille…' : 'Rechercher un joueur, une licence, une équipe…';
  etat.onglet === 'rencontres' ? rendreRencontres() : rendreJoueurs();
  ecrireHash();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) { etat.saison = b.dataset.s; etat.compet = etat.championnat = ''; etat.ouvert = {rencontres: null, joueurs: null}; }
  else if (b.dataset.o) { etat.onglet = b.dataset.o; }
  else if (b.dataset.k) { etat[b.dataset.k] = b.dataset.v; }
  else return;
  rendre();
});
// Accordéon : ouvrir un groupe referme les autres du même onglet.
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches?.('details.compet')) return;
  const onglet = d.dataset.onglet;
  if (d.open) {
    etat.ouvert[onglet] = d.dataset.cle;
    document.querySelectorAll(`details.compet[data-onglet="${onglet}"][open]`).forEach(x => { if (x !== d) x.open = false; });
  } else if (etat.ouvert[onglet] === d.dataset.cle) etat.ouvert[onglet] = null;
}, true);
$('#q').addEventListener('input', e => { etat.q = e.target.value; rendre(); });
$('#tri').addEventListener('change', e => { etat.tri = e.target.value; rendre(); });
$('#poste').addEventListener('change', e => { etat.poste = e.target.value; rendre(); });
lireHash(); rendre();
</script>
</body>
</html>
